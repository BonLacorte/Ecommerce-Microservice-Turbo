# ===========================================
# Ecommerce Microservice Turbo - Docker Compose
# ===========================================
# Usage:
#   1. Copy .env.example to .env and fill in your API keys
#   2. Run: docker-compose up --build
#   3. Wait ~60 seconds for all services to start
#   4. Access: Client (http://localhost:3002), Admin (http://localhost:3003), Kafka UI (http://localhost:8080)

services:
  # =====================
  # INFRASTRUCTURE
  # =====================

  # --- PostgreSQL (Product Database) ---
  ecommerce-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_products
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MongoDB (Order Database) ---
  ecommerce-mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Kafka Broker 1 ---
  kafka-broker-1:
    image: apache/kafka:latest
    container_name: kafka-broker-1
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker-1:9092,EXTERNAL://localhost:9094
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CLUSTER_ID=7Dvn0OLMQo-bg4qmCmflVg
    ports:
      - "9094:9094"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- Kafka Broker 2 ---
  kafka-broker-2:
    image: apache/kafka:latest
    container_name: kafka-broker-2
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker-2:9092,EXTERNAL://localhost:9095
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CLUSTER_ID=7Dvn0OLMQo-bg4qmCmflVg
    ports:
      - "9095:9095"
    networks:
      - app-network

  # --- Kafka Broker 3 ---
  kafka-broker-3:
    image: apache/kafka:latest
    container_name: kafka-broker-3
    environment:
      - KAFKA_NODE_ID=3
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker-3:9092,EXTERNAL://localhost:9096
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CLUSTER_ID=7Dvn0OLMQo-bg4qmCmflVg
    ports:
      - "9096:9096"
    networks:
      - app-network

  # --- Kafka UI ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092
      - KAFKA_CLUSTERS_0_READONLY=false
      - KAFKA_CLUSTERS_0_TOPIC_AUTO_CREATE=true
    networks:
      - app-network

  # --- Kafka Topic Initializer ---
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka-broker-1:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..."
        sleep 10
        /opt/kafka/bin/kafka-topics.sh --create --topic user.created --bootstrap-server kafka-broker-1:9092 --partitions 3 --replication-factor 3 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --topic order.created --bootstrap-server kafka-broker-1:9092 --partitions 3 --replication-factor 3 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --topic product.created --bootstrap-server kafka-broker-1:9092 --partitions 3 --replication-factor 3 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --topic product.deleted --bootstrap-server kafka-broker-1:9092 --partitions 3 --replication-factor 3 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --topic payment.successful --bootstrap-server kafka-broker-1:9092 --partitions 3 --replication-factor 3 --if-not-exists
        echo "All Kafka topics created successfully!"

  # =====================
  # APPLICATION
  # =====================

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ecommerce-app
    depends_on:
      ecommerce-postgres:
        condition: service_healthy
      ecommerce-mongodb:
        condition: service_healthy
      kafka-broker-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "3002:3002"   # Client Storefront
      - "3003:3003"   # Admin Dashboard
      - "8000:8000"   # Product Service
      - "8001:8001"   # Order Service
      - "8002:8002"   # Payment Service
      - "8003:8003"   # Auth Service
    env_file:
      - .env
    environment:
      # Override database URLs to use Docker hostnames
      - DATABASE_URL=postgresql://postgres:postgres@ecommerce-postgres:5432/ecommerce_products
      - MONGO_URL=mongodb://ecommerce-mongodb:27017/ecommerce_orders?directConnection=true
      # Override Kafka brokers to use Docker internal network
      - KAFKA_BROKERS=kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092
      # Service URLs (all in same container, so localhost works)
      - NEXT_PUBLIC_PRODUCT_SERVICE_URL=http://localhost:8000
      - NEXT_PUBLIC_ORDER_SERVICE_URL=http://localhost:8001
      - NEXT_PUBLIC_PAYMENT_SERVICE_URL=http://localhost:8002
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:8003
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:

networks:
  app-network:
    driver: bridge
